; AI 도슨트 FastAPI 서버 주소 (끝에 / 없이).
; 에디터 PIE 는 127.0.0.1 로 되지만, 실기기(폰)에서는 PC 의 LAN IP 여야 한다.
;   1) PC 에서 ipconfig 로 IPv4 주소 확인   예) 192.168.0.12
;   2) 아래 값을 "http://192.168.0.12:8000" 으로 변경 (따옴표째로)
;   3) 서버는 uvicorn app.main:app --host 0.0.0.0 --port 8000 으로 기동
;      (--host 를 주지 않으면 127.0.0.1 만 리슨해서 폰에서 안 붙는다)
; 값의 따옴표는 필수다. UE 설정 파서는 따옴표 밖의 // 를 주석 시작으로 보고
; 그 뒤를 버린다(ConfigCacheIni.cpp). 따옴표가 없으면 이 값은 "http:" 가 된다.
ServerBaseUrl="http://127.0.0.1:8000"
; 서버 LLM 타임아웃이 10초라 그보다 넉넉해야 한다.
RequestTimeoutSec=15.0
